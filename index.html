<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NestHub - Fast Grocery Delivery</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

<div class="logo">
🌿 <span>NestHub</span>
</div>

<div class="location">
📍 Deliver to <b>Home</b>
</div>

<div class="search">
<input type="text" placeholder="Search groceries, fruits, snacks...">
<button>🔍</button>
</div>

<div class="nav-buttons">
<button class="login">Login</button>
<button class="cart">
🛒 Cart <span>0</span>
</button>
</div>

<div class="menu">
☰
</div>

</header>


<!-- HERO SECTION -->

<section class="hero">

<div class="hero-content">

<h1>
Fresh groceries
<br>
<span>delivered faster</span>
</h1>

<p>
NestHub brings fresh vegetables, fruits, daily essentials
and more directly to your doorstep.
</p>


<div class="hero-buttons">

<button class="primary">
Start Shopping →
</button>

<button class="secondary">
Explore Products
</button>

</div>


<div class="stats">

<div>
<h2>10K+</h2>
<p>Products</p>
</div>

<div>
<h2>5K+</h2>
<p>Happy Users</p>
</div>

<div>
<h2>15 min</h2>
<p>Delivery</p>
</div>

</div>


</div>


<div class="hero-image">

<div class="circle"></div>

<div class="grocery-box">
🥦 🥕 🍎
</div>

</div>


</section>


<!-- SCROLL -->

<div class="scroll">
↓ Scroll
</div>


<script src="script.js"></script>

</body>
</html>
