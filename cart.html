
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestHub Cart</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
color:#16a34a;
margin-bottom:20px;
}

.cart-item{
background:#fff;
border-radius:15px;
padding:15px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.left{
display:flex;
align-items:center;
gap:15px;
}

.left img{
width:90px;
height:90px;
object-fit:cover;
border-radius:12px;
}

.left h3{
margin-bottom:8px;
}

button{
padding:10px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.remove{
background:#e53935;
color:white;
}

.checkout{
width:100%;
margin-top:20px;
background:#16a34a;
color:white;
padding:15px;
font-size:18px;
}

#total{
margin-top:20px;
text-align:right;
font-size:24px;
font-weight:bold;
}

.empty{
text-align:center;
margin-top:60px;
font-size:22px;
color:#666;
}
</style>

</head>

<body>

<h1>🛒 Your Cart</h1>

<div id="cart-items"></div>

<h2 id="total"></h2>

<button class="checkout" onclick="alert('Checkout coming soon!')">
Proceed to Checkout
</button>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

const cartItems = document.getElementById("cart-items");
const total = document.getElementById("total");

function displayCart(){

cartItems.innerHTML="";

let grandTotal=0;

if(cart.length===0){

cartItems.innerHTML="<div class='empty'>Your cart is empty 🛒</div>";

total.innerHTML="";

return;

}

cart.forEach((item,index)=>{

grandTotal += item.price * item.quantity;

cartItems.innerHTML += `
<div class="cart-item">

<div class="left">

<img src="${item.image}">

<div>

<h3>${item.name}</h3>

<p>₹${item.price}</p>

<p>Quantity: ${item.quantity}</p>

</div>

</div>

<button class="remove" onclick="removeItem(${index})">
Remove
</button>

</div>
`;

});

total.innerHTML="Total: ₹"+grandTotal;

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

displayCart();

}

displayCart();

</script>

</body>
</html>
